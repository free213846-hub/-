<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>푸른하늘 탐험대 게임</title>
    <style>
        body { margin: 0; background: #87CEEB; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%); overflow: hidden; }
        
        /* 캐릭터 및 배경 */
        #player { width: 80px; height: 80px; border-radius: 50%; border: 4px solid white; position: absolute; bottom: 50px; left: 50px; z-index: 10; display: none; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .floor { position: absolute; bottom: 0; width: 200%; height: 50px; background: #4CAF50; }
        
        /* UI */
        #ui { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around; color: #fff; font-weight: bold; font-size: 20px; text-shadow: 2px 2px 4px #000; z-index: 20; display: none; }
        #bubble { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 20px; width: 80%; text-align: center; font-size: 18px; font-weight: bold; border: 4px solid #2196F3; z-index: 30; }
        #teacher { font-size: 80px; position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); z-index: 25; }

        /* 카메라 */
        #camera-layer { position: absolute; inset: 0; background: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; }
        #video { width: 250px; height: 250px; border-radius: 50%; border: 5px solid #2196F3; object-fit: cover; transform: scaleX(-1); }
        
        /* 아이템 및 장애물 */
        .item { position: absolute; font-size: 40px; z-index: 5; }
        
        .btn { padding: 15px 30px; background: #FFC107; border: none; border-radius: 30px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #FFA000; margin-top: 20px; }
        #start-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 40; }
    </style>
</head>
<body onclick="jump()">

<div id="game-container">
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="timer">30</span></div>
    </div>

    <div id="bubble">화면 아래 버튼을 눌러줘!</div>
    <div id="teacher">👩‍🏫</div>
    <img id="player" src="">
    <div class="floor" id="floor"></div>

    <button id="start-btn" class="btn" onclick="nextStep(event)">시작하기</button>

    <div id="camera-layer">
        <h2 style="color:#2196F3">📸 대원 사진 찍기</h2>
        <video id="video" autoplay playsinline></video>
        <button class="btn" onclick="takePhoto()">지금 찍기!</button>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    let step = 0;
    let score = 0;
    let timeLeft = 30;
    let isJumping = false;
    let gameActive = false;
    let audioCtx = null;

    const teacherLines = [
        "안녕! 나는 푸른하늘 선생님이야!",
        "오늘 우리 친구가 게임 세상 속 주인공이 될 거야!",
        "규칙은 간단해! 화면을 눌러 점프해서 별을 먹고 폭탄은 피해봐!",
        "자, 이제 너의 사진을 찍어서 멋진 탐험가로 변신해볼까?"
    ];

    function speak(text, onEnd) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.8;
        utterance.pitch = 1.3;
        if (onEnd) utterance.onend = onEnd;
        window.speechSynthesis.speak(utterance);
        document.getElementById('bubble').innerText = text;
    }

    function nextStep(e) {
        e.stopPropagation();
        if (step < teacherLines.length) {
            speak(teacherLines[step]);
            step++;
        } else {
            openCamera();
        }
    }

    async function openCamera() {
        document.getElementById('camera-layer').style.display = 'flex';
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('video').srcObject = stream;
    }

    function takePhoto() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        canvas.width = 300; canvas.height = 300;
        const ctx = canvas.getContext('2d');
        ctx.translate(300, 0); ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, 300, 300);
        
        document.getElementById('player').src = canvas.toDataURL('image/png');
        video.srcObject.getTracks().forEach(t => t.stop());
        
        document.getElementById('camera-layer').style.display = 'none';
        document.getElementById('teacher').style.display = 'none';
        document.getElementById('bubble').style.display = 'none';
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('player').style.display = 'block';
        document.getElementById('ui').style.display = 'flex';
        
        initAudio();
        startGame();
    }

    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        playBGM();
    }

    function playBGM() {
        const melody = [329, 293, 261, 293, 329, 329, 329]; // 비행기 멜로디
        let i = 0;
        setInterval(() => {
            if (!gameActive) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.frequency.value = melody[i];
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            i = (i + 1) % melody.length;
        }, 500);
    }

    function jump() {
        if (!gameActive || isJumping) return;
        isJumping = true;
        let p = document.getElementById('player');
        p.style.transition = "bottom 0.4s ease-out";
        p.style.bottom = "180px";
        setTimeout(() => {
            p.style.bottom = "50px";
            setTimeout(() => isJumping = false, 400);
        }, 400);
    }

    function startGame() {
        gameActive = true;
        let timerInt = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                gameActive = false;
                clearInterval(timerInt);
                endGame();
            }
        }, 1000);
        spawnItems();
    }

    function spawnItems() {
        if (!gameActive) return;
        const item = document.createElement('div');
        const isTrash = Math.random() > 0.6;
        item.className = 'item';
        item.innerText = isTrash ? '💣' : '⭐';
        item.style.bottom = isTrash ? '50px' : '150px';
        item.style.right = '-50px';
        document.getElementById('game-container').appendChild(item);

        let move = setInterval(() => {
            if (!gameActive) { clearInterval(move); item.remove(); return; }
            let r = parseInt(item.style.right);
            item.style.right = (r + 5) + 'px';

            // 충돌 감지
            let p = document.getElementById('player').getBoundingClientRect();
            let i = item.getBoundingClientRect();
            if (i.left < p.right && i.right > p.left && i.top < p.bottom && i.bottom > p.top) {
                if (isTrash) { score -= 5; document.body.style.backgroundColor = 'red'; }
                else { score += 10; document.body.style.backgroundColor = '#87CEEB'; }
                document.getElementById('score').innerText = score;
                clearInterval(move); item.remove();
            }
            if (r > window.innerWidth) { clearInterval(move); item.remove(); }
        }, 20);

        setTimeout(spawnItems, Math.random() * 1000 + 1000);
    }

    function endGame() {
        speak("게임 끝! 너의 점수는 " + score + "점이야! 정말 멋진 탐험가구나!");
        document.getElementById('bubble').style.display = 'block';
        setTimeout(() => location.reload(), 5000);
    }
</script>
</body>
</html>
